<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Moirai+One&display=swap" rel="stylesheet">
  <title>Efecto Tinta - Hola</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4ebd9; /* Fondo estilo papel antiguo */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>

  <canvas id="inkCanvas"></canvas>

  <script>
    const canvas = document.getElementById('inkCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      init();
    });

    const particles = [];
    const particleCount = 2200;
    let animationFrame;

    class InkParticle {
      constructor(targetX, targetY) {
        // Posición inicial: Mancha derramada en el centro con dispersión aleatoria
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 70 + Math.random() * 30;
        this.x = width / 2 + Math.cos(angle) * radius;
        this.y = height / 2 + Math.sin(angle) * radius;

        // Posición final (donde se forma la letra)
        this.targetX = targetX;
        this.targetY = targetY;

        // Tamaño y fluidez
        this.size = Math.random() * 3.5 + 1.5;
        this.speed = Math.random() * 0.02 + 0.015; // Velocidad de atracción
        this.wobble = Math.random() * 2;
      }

      update() {
        // Movimiento suave hacia el objetivo (interpolación lineal)
        this.x += (this.targetX - this.x) * this.speed;
        this.y += (this.targetY - this.y) * this.speed;

        // Pequeño movimiento fluido imitando tinta
        this.x += Math.sin(Date.now() * 0.003 + this.wobble) * 0.2;
        this.y += Math.cos(Date.now() * 0.003 + this.wobble) * 0.2;
      }

      draw() {
        ctx.fillStyle = '#111115'; // Color tinta oscura
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function getTargetPoints() {
      // Canvas auxiliar en memoria para extraer los píxeles de la palabra "Hola"
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      offCanvas.width = width;
      offCanvas.height = height;

      const fontSize = Math.min(width * 0.25, 200);
      offCtx.font = `bold italic ${fontSize}px "Moirai One"`;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillStyle = 'black';
      offCtx.fillText('Club Bruto', width / 2, height / 2);

      const imgData = offCtx.getImageData(0, 0, width, height).data;
      const points = [];

      // Escanear píxeles dibujados
      const step = 4;
      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const index = (y * width + x) * 4 + 3; // Canal Alpha
          if (imgData[index] > 128) {
            points.push({ x, y });
          }
        }
      }
      return points;
    }

    function init() {
      particles.length = 0;
      const targetPoints = getTargetPoints();

      if (targetPoints.length === 0) return;

      for (let i = 0; i < particleCount; i++) {
        // Asignar un punto de destino aleatorio dentro de las letras
        const randomPoint = targetPoints[Math.floor(Math.random() * targetPoints.length)];
        particles.push(new InkParticle(randomPoint.x, randomPoint.y));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Dibujar partículas de tinta
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }

      requestAnimationFrame(animate);
    }

    init();
    animate();
  </script>
</body>
</html>
