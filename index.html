<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liquid Text Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .stage {
      width: min(92vw, 900px);
      display: grid;
      place-items: center;
    }

    svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    #liquidText {
      font-size: 180px;
      font-weight: 800;
      letter-spacing: -8px;
      fill: #000;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    @media (max-width: 700px) {
      #liquidText {
        font-size: 120px;
        letter-spacing: -5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #liquidText {
        filter: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="stage" aria-label="Demostración de texto líquido">
    <svg
      viewBox="0 0 1000 360"
      role="img"
      aria-label="Hola!"
      preserveAspectRatio="xMidYMid meet"
    >
      <defs>
        <filter
          id="liquid"
          x="-35%"
          y="-80%"
          width="170%"
          height="260%"
          color-interpolation-filters="sRGB"
        >
          <!-- Ruido que empuja la silueta -->
          <feTurbulence
            id="noise"
            type="fractalNoise"
            baseFrequency="0.012 0.025"
            numOctaves="2"
            seed="7"
            result="noise"
          />

          <feDisplacementMap
            id="displace"
            in="SourceGraphic"
            in2="noise"
            scale="72"
            xChannelSelector="R"
            yChannelSelector="G"
            result="displaced"
          />

          <!-- Engorda las letras para que se unan como una mancha -->
          <feMorphology
            id="morph"
            in="displaced"
            operator="dilate"
            radius="13"
            result="fat"
          />

          <!-- Suaviza los bordes -->
          <feGaussianBlur
            id="blur"
            in="fat"
            stdDeviation="9"
            result="soft"
          />

          <!-- Recupera una silueta negra compacta -->
          <feComponentTransfer in="soft" result="ink">
            <feFuncA
              id="threshold"
              type="table"
              tableValues="0 0 0 0 0.2 0.95 1 1"
            />
          </feComponentTransfer>

          <feComposite in="ink" in2="SourceGraphic" operator="over" />
        </filter>
      </defs>

      <text
        id="liquidText"
        x="500"
        y="180"
        filter="url(#liquid)"
      >Hola!</text>
    </svg>
  </main>

  <script>
    const reduceMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    const text = document.querySelector("#liquidText");
    const displacement = document.querySelector("#displace");
    const morphology = document.querySelector("#morph");
    const blur = document.querySelector("#blur");
    const turbulence = document.querySelector("#noise");
    const threshold = document.querySelector("#threshold");

    const WAIT_BEFORE_REVEAL = 2000;
    const REVEAL_DURATION = 1500;

    const easeInOutCubic = (t) =>
      t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;

    function lerp(from, to, t) {
      return from + (to - from) * t;
    }

    function revealText() {
      const start = performance.now();

      function frame(now) {
        const raw = Math.min((now - start) / REVEAL_DURATION, 1);
        const t = easeInOutCubic(raw);

        displacement.setAttribute("scale", lerp(72, 0, t).toFixed(2));
        morphology.setAttribute("radius", lerp(13, 0, t).toFixed(2));
        blur.setAttribute("stdDeviation", lerp(9, 0, t).toFixed(2));

        const fx = lerp(0.012, 0.035, t);
        const fy = lerp(0.025, 0.055, t);
        turbulence.setAttribute(
          "baseFrequency",
          `${fx.toFixed(4)} ${fy.toFixed(4)}`
        );

        if (raw < 0.72) {
          const k = raw / 0.72;
          threshold.setAttribute(
            "tableValues",
            `0 0 0 0 ${lerp(0.2, 0.05, k).toFixed(3)} 0.95 1 1`
          );
        }

        if (raw < 1) {
          requestAnimationFrame(frame);
        } else {
          text.style.filter = "none";
        }
      }

      requestAnimationFrame(frame);
    }

    if (reduceMotion) {
      text.style.filter = "none";
    } else {
      window.addEventListener(
        "load",
        () => {
          window.setTimeout(revealText, WAIT_BEFORE_REVEAL);
        },
        { once: true }
      );
    }
  </script>
</body>
</html>
