<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="38 72 1382 885"
  role="img"
  aria-labelledby="title desc"
  class="club-bruto-logo"
>
  <title id="title">Club Bruto</title>
  <desc id="desc">
    Logotipo Club Bruto con gradientes por tinta, contorno negro más delgado
    y granulado de puntos negros, incluyendo puntos más grandes cerca de los bordes.
  </desc>

  <style>
    /* ======================================================
       CLUB BRUTO — PALETA DEL EVENTO
       Cambia estos colores cuando quieras adaptar el logo
       a otro flyer o identidad visual.
       ====================================================== */

    .logo-ink-black {
      fill: #111111;
    }

    .logo-ink-1 {
      fill: url(#grad-ink-1);
    }

    .logo-ink-2 {
      fill: url(#grad-ink-2);
    }

    .logo-ink-3 {
      fill: url(#grad-ink-3);
    }

    .logo-ink-white {
      fill: url(#grad-ink-white);
    }
  </style>

