    <!-- Gradientes suaves para evitar color plano -->

    <!-- Gradientes cromáticos más saturados -->
    <linearGradient id="grad-ink-1" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#82D64C" />
      <stop offset="28%" stop-color="#A7F23E" />
      <stop offset="58%" stop-color="#91E735" />
      <stop offset="82%" stop-color="#B4F45A" />
      <stop offset="100%" stop-color="#9DDF69" />
    </linearGradient>

    <linearGradient id="grad-ink-2" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F18C35" />
      <stop offset="28%" stop-color="#FF9F33" />
      <stop offset="58%" stop-color="#F6A744" />
      <stop offset="82%" stop-color="#FFB34C" />
      <stop offset="100%" stop-color="#F2AD62" />
    </linearGradient>

    <linearGradient id="grad-ink-3" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#35C5D6" />
      <stop offset="28%" stop-color="#36E4F2" />
      <stop offset="58%" stop-color="#42D5E4" />
      <stop offset="82%" stop-color="#4BEAF4" />
      <stop offset="100%" stop-color="#69D4DC" />
    </linearGradient>

    <linearGradient id="grad-ink-white" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F2EEE7" />
      <stop offset="28%" stop-color="#FFFDFC" />
      <stop offset="58%" stop-color="#F5F1EA" />
      <stop offset="82%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </linearGradient>


    <clipPath id="letter-fill-clip">
      <use href="#shape-c" />
      <use href="#shape-l" />
      <use href="#shape-u-top" />
      <use href="#shape-b-top" />
      <use href="#shape-b-bottom" />
      <use href="#shape-r" />
      <use href="#shape-u-bottom" />
      <use href="#shape-t" />
      <use href="#shape-o" />
    </clipPath>

    <!-- Máscara para limitar puntos grandes a una franja interior cercana al borde -->
    <mask
      id="edge-zone-mask"
      maskUnits="userSpaceOnUse"
      x="38"
      y="72"
      width="1382"
      height="885"
      style="mask-type:luminance"
    >
      <rect x="38" y="72" width="1382" height="885" fill="black" />
      <g
        transform="translate(1.8 1.2)"
        fill="none"
        stroke="white"
        stroke-width="34"
        stroke-linejoin="round"
        stroke-linecap="round"
      >
      <use href="#shape-c" />
      <use href="#shape-l" />
      <use href="#shape-u-top" />
      <use href="#shape-b-top" />
      <use href="#shape-b-bottom" />
      <use href="#shape-r" />
      <use href="#shape-u-bottom" />
      <use href="#shape-t" />
      <use href="#shape-o" />
      </g>
    </mask>

    <!-- Granulado general: puntos pequeños y medianos -->
    <pattern
      id="dots-general"
      width="54"
      height="48"
      patternUnits="userSpaceOnUse"
    >
      <circle cx="7" cy="8" r="1.8" fill="#111111" />
      <circle cx="22" cy="6" r="1.2" fill="#111111" />
      <circle cx="37" cy="10" r="1.6" fill="#111111" />
      <circle cx="49" cy="7" r="1.0" fill="#111111" />

      <circle cx="12" cy="22" r="1.3" fill="#111111" />
      <circle cx="27" cy="24" r="2.0" fill="#111111" />
      <circle cx="43" cy="20" r="1.4" fill="#111111" />

      <circle cx="6" cy="38" r="1.5" fill="#111111" />
      <circle cx="19" cy="42" r="1.1" fill="#111111" />
      <circle cx="34" cy="37" r="1.7" fill="#111111" />
      <circle cx="48" cy="40" r="1.3" fill="#111111" />
    </pattern>

    <!-- Puntos de borde: más grandes, negros, distribuidos irregularmente -->
    <pattern
      id="dots-edge"
      width="112"
      height="96"
      patternUnits="userSpaceOnUse"
    >
      <circle cx="10" cy="12" r="4.8" fill="#111111" />
      <circle cx="41" cy="18" r="3.4" fill="#111111" />
      <circle cx="73" cy="11" r="2.4" fill="#111111" />
      <circle cx="95" cy="25" r="4.1" fill="#111111" />

      <circle cx="24" cy="43" r="2.8" fill="#111111" />
      <circle cx="56" cy="51" r="4.6" fill="#111111" />
      <circle cx="86" cy="44" r="3.0" fill="#111111" />
      <circle cx="102" cy="58" r="2.1" fill="#111111" />

      <circle cx="12" cy="73" r="3.6" fill="#111111" />
      <circle cx="40" cy="83" r="2.3" fill="#111111" />
      <circle cx="69" cy="74" r="4.2" fill="#111111" />
      <circle cx="96" cy="82" r="3.1" fill="#111111" />
    </pattern>
  </defs>

  <!-- Base negra -->
  <g id="black-print" class="logo-ink-black">
    <use href="#shape-black-master" />
  </g>

  <!-- Tintas de color: menor desplazamiento para adelgazar el contorno -->
  <g id="color-print" transform="translate(1.8 1.2)">
    <use href="#shape-c" class="logo-ink-1" />
    <use href="#shape-l" class="logo-ink-2" />
    <use href="#shape-u-top" class="logo-ink-3" />
    <use href="#shape-b-top" class="logo-ink-white" />
    <use href="#shape-b-bottom" class="logo-ink-2" />
    <use href="#shape-r" class="logo-ink-3" />
    <use href="#shape-u-bottom" class="logo-ink-1" />
    <use href="#shape-t" class="logo-ink-2" />
    <use href="#shape-o" class="logo-ink-3" />
  </g>

  <!-- Granulado general -->
  <g
    id="print-dot-grid-general"
    clip-path="url(#letter-fill-clip)"
    transform="translate(1.8 1.2)"
    pointer-events="none"
  >
    <rect
      x="38"
      y="72"
      width="1382"
      height="885"
      fill="url(#dots-general)"
    />
  </g>

  <!-- Puntos más grandes cerca del borde -->
  <g
    id="print-dot-grid-edge"
    clip-path="url(#letter-fill-clip)"
    mask="url(#edge-zone-mask)"
    transform="translate(1.8 1.2)"
    pointer-events="none"
  >
    <rect
      x="38"
      y="72"
      width="1382"
      height="885"
      fill="url(#dots-edge)"
    />
  </g>
</svg>
