<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>One Page</title>

  <!-- Tipografía manuscrita para el slogan -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Dokdo&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- =========================================
       HEADER
  ========================================== -->

  <header class="site-header">

    <a href="#inicio" class="brand" aria-label="Ir al inicio">
      <!--
        Cambia esta ruta por tu logo SVG real.
      -->
      <img
        src="assets/logo.svg"
        alt="Logo"
        class="brand__logo"
      >
    </a>

    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-label="Abrir menú"
      aria-expanded="false"
      aria-controls="siteMenu"
    >

      <!-- Tacita -->
      <svg
        class="cup-icon"
        viewBox="0 0 64 64"
        aria-hidden="true"
      >

        <!-- vapor -->
        <path
          class="cup-steam cup-steam--1"
          d="M22 17 C18 12, 27 10, 22 5"
        />

        <path
          class="cup-steam cup-steam--2"
          d="M35 17 C31 12, 40 10, 35 5"
        />

        <!-- taza -->
        <path
          class="cup-body"
          d="M15 23 H44 V38
             C44 48 38 53 29.5 53
             C21 53 15 48 15 38 Z"
        />

        <!-- asa -->
        <path
          class="cup-handle"
          d="M44 28 H49
             C56 28 57 41 48 42
             H43"
        />

        <!-- plato -->
        <path
          class="cup-plate"
          d="M11 55 H48"
        />

      </svg>

    </button>

  </header>


  <!-- =========================================
       MENÚ
  ========================================== -->

  <div
    class="menu-backdrop"
    id="menuBackdrop"
  ></div>

  <nav
    class="site-menu"
    id="siteMenu"
    aria-label="Navegación principal"
  >

    <div class="site-menu__top">

      <span class="site-menu__label">
        Explorar
      </span>

      <button
        class="menu-close"
        id="menuClose"
        type="button"
        aria-label="Cerrar menú"
      >
        ×
      </button>

    </div>


    <div class="site-menu__links">

      <a href="#inicio">
        <span class="menu-number">01</span>
        Inicio
      </a>

      <a href="pagina-2.html">
        <span class="menu-number">02</span>
        Otra historia
      </a>

      <a href="pagina-3.html">
        <span class="menu-number">03</span>
        Otro proyecto
      </a>

      <a href="#contacto">
        <span class="menu-number">04</span>
        Contacto
      </a>

    </div>


    <div class="site-menu__footer">
      Hecho sin demasiadas reglas.
    </div>

  </nav>


  <!-- =========================================
       CONTENIDO PRINCIPAL
  ========================================== -->

  <main class="hero" id="inicio">

    <div class="hero__content">

      <p class="hero__eyebrow">
        SERIGRAFÍA · IDEAS · COSAS
      </p>

      <h1 class="hero__title">
        Una idea.<br>
        Una página.<br>
        <span>Mucho carácter.</span>
      </h1>

      <p class="hero__description">
        Este espacio puede convertirse en el contenido
        principal de esta primera one page.
      </p>

    </div>


    <!-- Elemento decorativo -->
    <div class="ink-shape ink-shape--one"></div>
    <div class="ink-shape ink-shape--two"></div>

  </main>



  <!-- =========================================
       FOOTER
       Empieza oculto.
  ========================================== -->

  <footer
    class="site-footer"
    id="siteFooter"
    aria-hidden="true"
  >

    <!-- IZQUIERDA -->

    <div
      class="footer-social"
      id="contacto"
    >

      <!-- Instagram -->

    <a
      href="#"
      class="social-link social-link--sketch"
      aria-label="Instagram"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" class="social-icon-sketch">
        <path d="M8.1 4.9
                 H15.8
                 C18.2 4.9 19.2 5.9 19.2 8.3
                 V15.7
                 C19.2 18.1 18.2 19.1 15.8 19.1
                 H8.1
                 C5.8 19.1 4.8 18.1 4.8 15.7
                 V8.3
                 C4.8 5.9 5.8 4.9 8.1 4.9 Z" />

        <path d="M12 8.3
                 C14.2 8.3 15.8 9.9 15.8 12
                 C15.8 14.2 14.2 15.8 12 15.8
                 C9.9 15.8 8.3 14.2 8.3 12
                 C8.3 9.9 9.9 8.3 12 8.3 Z" />

        <path d="M16.9 7.2
                 C17.2 7.2 17.4 7.4 17.4 7.7
                 C17.4 8 17.2 8.2 16.9 8.2
                 C16.6 8.2 16.4 8 16.4 7.7
                 C16.4 7.4 16.6 7.2 16.9 7.2 Z" />
      </svg>
    </a>


      <!-- Email -->

      <a
        href="mailto:hola@tudominio.com"
        class="social-link"
        aria-label="Enviar correo"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <rect
            x="3"
            y="5"
            width="18"
            height="14"
            rx="2"
          />

          <path
            d="M4 7 L12 13 L20 7"
          />

        </svg>

      </a>

    </div>


    <!-- DERECHA / SLOGAN -->

    <div class="footer-slogan">

      <svg
        class="slogan-svg"
        viewBox="0 0 330 80"
        role="img"
        aria-label="Hecho a lo Bruto"
      >

        <!--
          Primera capa:
          el contorno se dibuja.
        -->
        <text
          x="325"
          y="54"
          text-anchor="end"
          class="slogan-stroke"
        >
          HECHO A LO BRUTO
        </text>


        <!--
          Segunda capa:
          aparece el relleno.
        -->
        <text
          x="325"
          y="54"
          text-anchor="end"
          class="slogan-fill"
        >
          HECHO A LO BRUTO
        </text>


        <!-- trazo inferior -->
        <path
          class="slogan-line"
          d="M103 67
             C155 72, 235 66, 319 69"
        />

      </svg>

    </div>

  </footer>


  <script src="app.js"></script>

</body>
</html>
